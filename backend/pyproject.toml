[project]
name = "sam2-annotator-api"
version = "0.1.0"
description = "Local FastAPI service for prompted SAM2 image annotation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<2.3",
    "pillow>=10,<13",
    "pycocotools>=2.0.8,<3",
    "python-multipart>=0.0.18,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
sam2 = [
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
